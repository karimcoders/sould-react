<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Soul-D.</title>
    <script>
      /* GitHub Pages SPA fallback — /sould-react/<kuch bhi> ko index.html par bhejo,
         path ko query me rakh kar, taaki React Router wahi page khol sake. */
      (function () {
        var segmentCount = 1; /* /sould-react */
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
